# Curated ontology + canonical vocabulary for the Movement/Clinical KG.
#
# DESIGN STANCE (see README "Ontology decisions"):
#   * We do NOT ingest OPE / SNOMED CT / COPPER wholesale. We curate a small
#     subset that is actually exercised by the supplied catalog and member.
#   * Every `ontology.code` below has been resolved against the NCI EVS REST
#     API (the terminology server the assessment brief itself names) and carries
#     the evidence string proving it. A concept that cannot be resolved keeps
#     its local canonical id and is listed under `unmapped` with the reason -
#     it never gets an invented identifier.
#   * `predicate` uses SKOS semantics:
#       skos:exactMatch - the local concept and the external concept denote the
#                         same thing (EVS preferred term or synonym matches);
#       skos:closeMatch - the local concept is a coarser product-level grouping
#                         that overlaps the external concept but is not identical;
#       skos:broadMatch - the external concept is *broader* than ours, i.e. our
#                         concept is a narrower part of it.
#
# The anatomy hierarchy below is the part that does real work: the catalog
# annotates exercises only at `knee` granularity, while the member's injury is
# *patellofemoral* pain. PART_OF lets an injury recorded at a sub-structure
# reach every exercise annotated at the joint above it.
#
# ---------------------------------------------------------------------------
# AUDIT NOTE (2026-08-12)
#
# An earlier revision of this file carried eleven SNOMED CT codes, all marked
# `status: verified`. Re-resolving each one against NCI EVS showed five of them
# were not verifiable:
#
#   202383002  claimed "Patellofemoral pain syndrome"     -> 404, no such concept
#   30989003   claimed "Arthralgia of knee"               -> 404, no such concept
#   122470009  claimed "Quadriceps femoris muscle"        -> 404, no such concept
#   68861009   claimed "Gluteal muscle structure"         -> Hexamita (a protozoan)
#   81022004   claimed "Hamstring muscle structure"       -> Vicia angustifolia (a plant)
#
# All five are corrected below and every remaining code carries a machine
# re-checkable evidence string. `python scripts/verify_ontology.py` re-runs the
# whole audit against the live terminology server.
# ---------------------------------------------------------------------------

# Provenance for the mapping set itself. `uri_template` is what turns a bare
# code into a dereferenceable identifier, so nothing downstream has to hardcode
# a URL shape.
mapping_set:
  version: "1.1.0"
  verified_on: "2026-08-12"
  method: >
    Each code was resolved with GET https://api-evsrest.nci.nih.gov/api/v1/concept/
    snomedct_us/<code> and accepted only if the concept exists, is active, and
    its preferred term or one of its synonyms denotes the local concept.

ontology_sources:
  SNOMED_CT:
    label: SNOMED CT (US edition)
    terminology: snomedct_us
    version: "2025_09_01"
    uri_template: "http://snomed.info/id/{code}"
    browser_template: >-
      https://evsexplore.semantics.cancer.gov/evsexplore/concept/snomedct_us/{code}
    api_template: "https://api-evsrest.nci.nih.gov/api/v1/concept/snomedct_us/{code}"
    used_for: Clinical anatomy, joints and conditions.
  SKOS:
    label: Simple Knowledge Organization System
    uri_template: "http://www.w3.org/2004/02/skos/core#{code}"
    used_for: The mapping predicates themselves (exactMatch / closeMatch / broadMatch).
  PROV_O:
    label: W3C Provenance Ontology
    uri_template: "http://www.w3.org/ns/prov#{code}"
    used_for: >-
      Provenance semantics, applied conceptually - generated entity, generating
      activity, derivation. No RDF stack.

anatomy:
  knee:
    label: Knee
    aliases: [knee, knees, knee joint, kneecap area, left knee, right knee, both knees]
    part_of: lower_limb
    ontology:
      source: SNOMED_CT
      code: "72696002"
      term: Knee region structure
      predicate: skos:exactMatch
      status: verified
      version: "2025_09_01"
