# Movement-pattern families. This is how "exclude deadlifts" works at all:
# the catalog contains ZERO exercises whose name contains "deadlift", so a
# naive string match finds nothing. The hinge/hip-lift family is the correct
# canonical target, and the graph resolves it.
movement_families:
  hinge:
    label: Hip Hinge / Deadlift Family
    aliases:
      - deadlift
      - deadlifts
      - dead lift
      - rdl
      - romanian deadlift
      - hinge
      - hip hinge
      - good morning
      - hamstring walkout
    patterns:
      - "lower pull - hip lift"
    note: >
      The supplied catalog has no exercise named "deadlift". The deadlift family
      is represented by the `lower pull - hip lift` movement pattern, which is
      what an exclusion must target. This is the clearest demonstration in the
      project that the graph - not string matching - carries the semantics.

  squat:
    label: Squat Family
    aliases: [squat, squats, squatting, goblet squat, back squat, front squat]
    patterns:
      - "lower push - squat"
      - "lower push - split squat"

  lunge:
    label: Lunge Family
    aliases: [lunge, lunges, split squat, step-up, step up]
    patterns:
      - "lower push - lunge"
      - "lower push - split squat"
      - "lower push - step-up"

  plyometric:
    label: Plyometric / Jumping Family
    aliases: [plyo, plyometric, plyometrics, jumping, jumps, jump training, high impact]
    patterns:
      - "cardio - plyometric"

  push:
    label: Push Family
    aliases: [push, pushing, press, pressing, chest work, pecs, pec work]
    patterns:
      - "upper push - horizontal"
      - "upper push - vertical"

  pull:
    label: Pull Family
    aliases: [pull, pulling, row, rows, back work, lat work]
    patterns:
      - "upper pull - horizontal"
      - "upper pull - vertical"

  core:
    label: Core Family
    aliases: [core, abs, midsection, trunk, anti-rotation]
    patterns:
      - "core - anti-extension"
      - "core - anti-lateral flexion"
      - "core - anti-rotation"
      - "core - carry"
      - "core - extension"
      - "core - flexion"
      - "core - rotation"

  mobility:
    label: Mobility / Regeneration Family
    aliases: [mobility, stretching, stretch, warmup, warm up, cooldown, cool down, recovery, regen]
    patterns:
      - "mobility - dynamic"
      - "mobility - static"
      - regen
      - yoga
      - massage

  cardio:
    label: Cardio Family
    aliases: [cardio, conditioning, aerobic, metcon]
    patterns:
      - cardio
      - "cardio - locomotion"

