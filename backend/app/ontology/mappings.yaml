# Movement-pattern families. This is how "exclude deadlifts" works at all:
# the catalog contains ZERO exercises whose name contains "deadlift", so a
# naive string match finds nothing. The hinge/hip-lift family is the correct
# canonical target, and the graph resolves it.
movement_families:
  hinge:
    label: Hip Hinge / Deadlift Family
    aliases:
      - deadlift
      - deadlifts
      - dead lift
      - rdl
      - romanian deadlift
      - hinge
      - hip hinge
      - good morning
      - hamstring walkout
    patterns:
      - "lower pull - hip lift"
    note: >
      The supplied catalog has no exercise named "deadlift". The deadlift family
      is represented by the `lower pull - hip lift` movement pattern, which is
      what an exclusion must target. This is the clearest demonstration in the
      project that the graph - not string matching - carries the semantics.

  squat:
    label: Squat Family
    aliases: [squat, squats, squatting, goblet squat, back squat, front squat]
    patterns:
      - "lower push - squat"
      - "lower push - split squat"

  lunge:
    label: Lunge Family
    aliases: [lunge, lunges, split squat, step-up, step up]
    patterns:
      - "lower push - lunge"
      - "lower push - split squat"
      - "lower push - step-up"

  plyometric:
    label: Plyometric / Jumping Family
    aliases: [plyo, plyometric, plyometrics, jumping, jumps, jump training, high impact]
    patterns:
      - "cardio - plyometric"

  push:
    label: Push Family
    aliases: [push, pushing, press, pressing, chest work, pecs, pec work]
    patterns:
      - "upper push - horizontal"
      - "upper push - vertical"

  pull:
    label: Pull Family
    aliases: [pull, pulling, row, rows, back work, lat work]
    patterns:
      - "upper pull - horizontal"
      - "upper pull - vertical"

  core:
    label: Core Family
    aliases: [core, abs, midsection, trunk, anti-rotation]
    patterns:
      - "core - anti-extension"
      - "core - anti-lateral flexion"
      - "core - anti-rotation"
      - "core - carry"
      - "core - extension"
      - "core - flexion"
      - "core - rotation"

  mobility:
    label: Mobility / Regeneration Family
    aliases: [mobility, stretching, stretch, warmup, warm up, cooldown, cool down, recovery, regen]
    patterns:
      - "mobility - dynamic"
      - "mobility - static"
      - regen
      - yoga
      - massage

  cardio:
    label: Cardio Family
    aliases: [cardio, conditioning, aerobic, metcon]
    patterns:
      - cardio
      - "cardio - locomotion"

# Focus keywords -> the muscle/anatomy targets a coach means by "lower body".
focus_targets:
  lower_body:
    label: Lower Body
    aliases: [lower body, lower-body, legs, leg day, lower]
    muscle_groups: [quads, glutes, hamstrings, calves, hip adductors, hip flexors]
    joints: [hip, knee, ankle]
  upper_body:
    label: Upper Body
    aliases: [upper body, upper-body, upper]
    muscle_groups: [chest, lats, deltoids, triceps, biceps, traps, upper back, middle back, rotator cuff, forearms]
    joints: [shoulder, elbow, wrist]
  full_body:
    label: Full Body
    aliases: [full body, full-body, total body, whole body]
    muscle_groups: []
    joints: []
  core:
    label: Core
    aliases: [core, abs, obliques, midsection]
    muscle_groups: [core, obliques, lower back]
    joints: [lumbar spine, thoracic spine]
  push:
    label: Push
    aliases: [push, pecs, chest, pressing]
    muscle_groups: [chest, deltoids, triceps]
    joints: [shoulder, elbow]
  pull:
    label: Pull
    aliases: [pull, back, lats, pulling]
    muscle_groups: [lats, upper back, middle back, biceps, traps]
    joints: [shoulder, elbow]

# Muscle-group grounding. Kept deliberately thin: these are product taxonomy
# labels, and only a few carry a defensible external mapping.
muscle_notes:
  quads:
    label: Quadriceps
    ontology:
      source: SNOMED_CT
      code: "122470009"
      term: Quadriceps femoris muscle structure
      predicate: skos:closeMatch
      status: verified
  glutes:
    label: Gluteal Muscles
    ontology:
      source: SNOMED_CT
      code: "68861009"
      term: Gluteal muscle structure
      predicate: skos:closeMatch
      status: verified
  hamstrings:
    label: Hamstrings
    ontology:
      source: SNOMED_CT
      code: "81022004"
      term: Hamstring muscle structure
      predicate: skos:closeMatch
      status: verified
