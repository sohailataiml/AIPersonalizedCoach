# Curated ontology + canonical vocabulary for the Movement/Clinical KG.
#
# DESIGN STANCE (see README "Ontology decisions"):
#   * We do NOT ingest OPE / SNOMED CT / COPPER wholesale. We curate a small
#     subset that is actually exercised by the supplied catalog and member.
#   * Every `ontology.code` below is either a SNOMED CT concept id we are
#     confident about, or omitted entirely. Where we could not verify an
#     identifier we keep the local canonical concept and set
#     `ontology.status: unverified` rather than inventing a code. The README
#     states plainly that production would complete this normalization against
#     a licensed terminology server (NCI EVS).
#   * `mapping_predicate` uses SKOS semantics: exactMatch when the local concept
#     and the external concept denote the same thing, closeMatch when the local
#     concept is a coarser product-level grouping.
#
# The anatomy hierarchy below is the part that does real work: the catalog
# annotates exercises only at `knee` granularity, while the member's injury is
# *patellofemoral* pain. PART_OF lets an injury recorded at a sub-structure
# reach every exercise annotated at the joint above it.

anatomy:
  knee:
    label: Knee
    aliases: [knee, knees, knee joint, kneecap area, left knee, right knee, both knees]
    part_of: lower_limb
    ontology:
      source: SNOMED_CT
      code: "72696002"
      term: Knee region structure
      predicate: skos:exactMatch
      status: verified

  patellofemoral_joint:
    label: Patellofemoral Joint
    aliases: [patellofemoral, patellofemoral joint, kneecap, patella tracking, pfj]
    part_of: knee
    ontology:
      source: SNOMED_CT
      term: Patellofemoral joint structure
      predicate: skos:exactMatch
      status: unverified
      note: >
        Local canonical concept retained. A licensed SNOMED CT lookup would
        confirm the patellofemoral joint structure code before production use.

  tibiofemoral_joint:
    label: Tibiofemoral Joint
    aliases: [tibiofemoral, tibiofemoral joint, main knee joint]
    part_of: knee

  hip:
    label: Hip
    aliases: [hip, hips, hip joint]
    part_of: lower_limb
    ontology:
      source: SNOMED_CT
      code: "29836001"
      term: Hip region structure
      predicate: skos:exactMatch
      status: verified

  ankle:
    label: Ankle
    aliases: [ankle, ankles, ankle joint]
    part_of: lower_limb
    ontology:
      source: SNOMED_CT
      code: "344001"
      term: Ankle region structure
      predicate: skos:exactMatch
      status: verified

  lower_limb:
    label: Lower Limb
    aliases: [lower limb, leg, legs, lower body]

  shoulder:
    label: Shoulder
    aliases: [shoulder, shoulders, shoulder joint, glenohumeral]
    part_of: upper_limb
    ontology:
      source: SNOMED_CT
      code: "16982005"
      term: Shoulder region structure
      predicate: skos:exactMatch
      status: verified

  elbow:
    label: Elbow
    aliases: [elbow, elbows, elbow joint]
    part_of: upper_limb

  wrist:
    label: Wrist
    aliases: [wrist, wrists, wrist joint]
    part_of: upper_limb

  upper_limb:
    label: Upper Limb
    aliases: [upper limb, arm, arms, upper body]

  lumbar_spine:
    label: Lumbar Spine
    aliases:
      - lumbar spine
      - lumbar
      - low back
      - lower back
      - bad lower back
      - bad back
      - sore lower back
      - lumbar region
      - l-spine
    part_of: spine
    ontology:
      source: SNOMED_CT
      code: "122496007"
      term: Lumbar spine structure
      predicate: skos:closeMatch
      status: verified

  thoracic_spine:
    label: Thoracic Spine
    aliases: [thoracic spine, mid back, middle back, t-spine, upper back spine]
    part_of: spine

  cervical_spine:
    label: Cervical Spine
    aliases: [cervical spine, neck, c-spine]
    part_of: spine

  spine:
    label: Spine
    aliases: [spine, back, vertebral column]

# Clinical conditions. `affects` points at an anatomy concept; the safety engine
# then walks PART_OF from there. `contraindicates` names movement-pattern
# families that are unsafe for the condition - these come from the injury's own
# clinical notes, not from a prompt.
injury_conditions:
  patellofemoral_pain_syndrome:
    label: Patellofemoral Pain Syndrome
    aliases:
      - patellofemoral pain
      - patellofemoral pain syndrome
      - pfps
      - runners knee
      - runner's knee
      - anterior knee pain
      - kneecap pain
    affects: patellofemoral_joint
    ontology:
      source: SNOMED_CT
      code: "202383002"
      term: Patellofemoral pain syndrome
      predicate: skos:exactMatch
      status: verified
    contraindicates_patterns:
      - "cardio - plyometric"
      - "lower push - squat"
      - "lower push - split squat"
      - "lower push - lunge"
    contraindication_note: >
      Derived from the member's recorded clinical note: "avoid deep knee flexion
      under load and plyometrics". Plyometric patterns are hard-excluded;
      loaded deep-flexion patterns are excluded only while the injury is acute
      and down-ranked while recovering (see safety/policies.py).

  knee_pain_generic:
    label: Knee Pain
    aliases: [knee pain, sore knee, knee injury, bad knee, knee is bothering her, knee flare-up]
    affects: knee
    ontology:
      source: SNOMED_CT
      code: "30989003"
      term: Arthralgia of knee
      predicate: skos:closeMatch
      status: verified
    contraindicates_patterns:
      - "cardio - plyometric"

  lumbar_pain_generic:
    label: Low Back Pain
    aliases: [low back pain, lower back pain, bad lower back, lumbago, back pain]
    affects: lumbar_spine
    ontology:
      source: SNOMED_CT
      code: "279039007"
      term: Low back pain
      predicate: skos:exactMatch
      status: verified
    contraindicates_patterns:
      - "core - extension"
      - "lower pull - hip lift"

