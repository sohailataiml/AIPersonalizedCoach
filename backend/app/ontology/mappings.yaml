# Muscle-group grounding.
#
# The catalog's 19 muscle groups are product taxonomy labels, not anatomical
# terms, so they ground unevenly on purpose. 13 of the 19 name a muscle that
# SNOMED CT models as a single body structure; the remaining 6 are regional
# groupings with no single external counterpart and are listed under
# `unmapped` rather than being forced onto an approximate code.
#
# Keys must match the catalog's `muscle_groups` values verbatim - that is how
# ingestion attaches the mapping to the Muscle node.
muscles:
  quads:
    label: Quadriceps
    ontology:
      source: SNOMED_CT
      code: "21989003"
      term: Structure of quadriceps femoris muscle
      predicate: skos:exactMatch
      status: verified
      version: "2025_09_01"
      evidence: >-
        NCI EVS snomedct_us 2025_09_01: concept 21989003 active, preferred term
        "Structure of quadriceps femoris muscle". CORRECTION: the previously
        recorded code 122470009 does not resolve in SNOMED CT (HTTP 404).

  glutes:
    label: Gluteal Muscles
    ontology:
      source: SNOMED_CT
      code: "206007"
      term: Structure of gluteus maximus muscle
      predicate: skos:closeMatch
      status: verified
      version: "2025_09_01"
      evidence: >-
        NCI EVS snomedct_us 2025_09_01: concept 206007 active, preferred term
        "Structure of gluteus maximus muscle". closeMatch, not exactMatch: the
        catalog's "glutes" covers maximus, medius and minimus, while SNOMED
        models each separately and has no combined gluteal-group structure.
        CORRECTION: the previously recorded code 68861009 resolves to
        "Hexamita", a genus of protozoa, and was plainly wrong.

  hamstrings:
    label: Hamstrings
    ontology:
      source: SNOMED_CT
      code: "128511007"
      term: Posterior muscle of thigh structure
      predicate: skos:exactMatch
      status: verified
      version: "2025_09_01"
      evidence: >-
        NCI EVS snomedct_us 2025_09_01: concept 128511007 active, preferred term
        "Posterior muscle of thigh structure", synonyms "Hamstring muscle" and
        "Hamstring muscle structure". CORRECTION: the previously recorded code
        81022004 resolves to "Vicia angustifolia", a plant species.

  calves:
    label: Calves
    ontology:
      source: SNOMED_CT
      code: "53451005"
      term: Triceps surae muscle structure
      predicate: skos:closeMatch
      status: verified
      version: "2025_09_01"
      evidence: >-
        NCI EVS snomedct_us 2025_09_01: concept 53451005 active, preferred term
        "Triceps surae muscle structure". closeMatch: triceps surae is
        gastrocnemius plus soleus, whereas the catalog's "calves" is also used
        for exercises loading the deeper plantarflexors.

  chest:
    label: Chest
    ontology:
      source: SNOMED_CT
      code: "60005003"
      term: Pectoralis major muscle structure
      predicate: skos:closeMatch
      status: verified
      version: "2025_09_01"
      evidence: >-
        NCI EVS snomedct_us 2025_09_01: concept 60005003 active, preferred term
        "Pectoralis major muscle structure". closeMatch: "chest" as a training
        target includes pectoralis minor and the anterior chest wall.

  lats:
    label: Latissimus Dorsi
    ontology:
      source: SNOMED_CT
      code: "15665001"
      term: Structure of latissimus dorsi muscle
      predicate: skos:exactMatch
      status: verified
      version: "2025_09_01"
      evidence: >-
        NCI EVS snomedct_us 2025_09_01: concept 15665001 active, preferred term
