      source: SNOMED_CT
      code: "303803003"
      term: Structure of adductor muscle of hip joint
      predicate: skos:closeMatch
      status: verified
      version: "2025_09_01"
      evidence: >-
        NCI EVS snomedct_us 2025_09_01: concept 303803003 active, preferred term
        "Structure of adductor muscle of hip joint". closeMatch: a group
        grounding onto the external adductor-muscle structure.

# Concepts that were reviewed and deliberately left ungrounded. This register is
# part of the mapping set, not an omission from it: an auditor can see exactly
# what was considered and why no identifier was recorded, and `verify_ontology`
# asserts that nothing here ever acquires a code by accident.
#
# The rule throughout: an unverifiable identifier is worse than no identifier,
# because it looks authoritative in a provenance trace while being fiction.
unmapped:
  muscles:
    concepts: [core, obliques, upper back, middle back, lower back, hip flexors, forearms]
    reason: >-
      Regional training groupings with no single SNOMED CT body structure.
      "Core" and "upper back" in particular span several muscles that SNOMED
      models individually; picking any one of them would assert an identity the
      catalog does not have.

  equipment:
    intended_source: OPE
    count: 32
    reason: >-
      OPE (Ontology of Physical Exercises) is the right source for equipment and
      exercise identity, but it is only distributed through BioPortal, whose
      REST API requires an account API key and returns HTTP 401 without one.
      OLS4 does not host OPE (HTTP 404). No OPE identifier could therefore be
      resolved from anything available to this build, so equipment keeps its
      local canonical ids. Resolving these needs a BioPortal key, not more code.

  movement_patterns:
    intended_source: OPE
    count: 36
    reason: >-
      Same blocker as equipment. The catalog's 36 movement patterns and the 9
      movement families derived from them stay local-only. This is the
      vocabulary the safety engine actually traverses, so it is fully specified
      locally regardless.

  personalization:
    intended_source: COPPER
    reason: >-
      COPPER models personalisation and behaviour-change concepts (adherence
      stage, motivation, tailoring). It shares BioPortal's API-key blocker, and
      the concepts this system personalises on today - adherence percentage,
      sleep hours, injury status - are numeric observations rather than
      behaviour-change constructs, so a mapping would be decorative even if the
      identifiers were reachable.
