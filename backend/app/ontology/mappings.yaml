# Clinical conditions. `affects` points at an anatomy concept; the safety engine
# then walks PART_OF from there. `contraindicates` names movement-pattern
# families that are unsafe for the condition - these come from the injury's own
# clinical notes, not from a prompt.
injury_conditions:
  patellofemoral_pain_syndrome:
    label: Patellofemoral Pain Syndrome
    aliases:
      - patellofemoral pain
      - patellofemoral pain syndrome
      - pfps
      - runners knee
      - runner's knee
      - anterior knee pain
      - kneecap pain
    affects: patellofemoral_joint
    ontology:
      source: SNOMED_CT
      code: "430725003"
      term: Patellofemoral stress syndrome
      predicate: skos:exactMatch
      status: verified
      version: "2025_09_01"
      evidence: >-
        NCI EVS snomedct_us 2025_09_01: concept 430725003 active, preferred term
        "Patellofemoral stress syndrome", synonyms "Patellofemoral pain
        syndrome" and "Patellofemoral syndrome" - the local label is a verbatim
        synonym, so exactMatch holds. CORRECTION: the previously recorded code
        202383002 does not resolve in SNOMED CT (HTTP 404).
    contraindicates_patterns:
      - "cardio - plyometric"
      - "lower push - squat"
      - "lower push - split squat"
      - "lower push - lunge"
    contraindication_note: >
      Derived from the member's recorded clinical note: "avoid deep knee flexion
      under load and plyometrics". Plyometric patterns are hard-excluded;
      loaded deep-flexion patterns are excluded only while the injury is acute
      and down-ranked while recovering (see safety/policies.py).

  knee_pain_generic:
    label: Knee Pain
    aliases: [knee pain, sore knee, knee injury, bad knee, knee is bothering her, knee flare-up]
    affects: knee
    ontology:
      source: SNOMED_CT
      code: "1003721002"
      term: Pain of joint of knee
      predicate: skos:closeMatch
      status: verified
      version: "2025_09_01"
      evidence: >-
        NCI EVS snomedct_us 2025_09_01: concept 1003721002 active, preferred
        term "Pain of joint of knee", synonym "Arthralgia of knee". closeMatch
        rather than exactMatch: the local concept also absorbs coach phrasings
        like "knee injury" and "bad knee", which are broader than arthralgia.
        CORRECTION: the previously recorded code 30989003 does not resolve in
        SNOMED CT (HTTP 404).
    contraindicates_patterns:
      - "cardio - plyometric"

  lumbar_pain_generic:
    label: Low Back Pain
    aliases: [low back pain, lower back pain, bad lower back, lumbago, back pain]
    affects: lumbar_spine
    ontology:
      source: SNOMED_CT
      code: "279039007"
      term: Low back pain
      predicate: skos:exactMatch
      status: verified
      version: "2025_09_01"
      evidence: >-
        NCI EVS snomedct_us 2025_09_01: concept 279039007 active, preferred term
        "Low back pain".
    contraindicates_patterns:
      - "core - extension"
      - "lower pull - hip lift"

