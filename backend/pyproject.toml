[project]
name = "future-coach-backend"
version = "0.1.0"
description = "Knowledge-graph backed coach intelligence platform - backend"
requires-python = ">=3.11"
dependencies = [
    # >=0.116.2 is a hard floor, not a preference. The MCP SDK requires
    # starlette>=0.48 on Python 3.14, while FastAPI <=0.116.0 pinned
    # starlette<0.47 - the two cannot co-exist below this version. 0.116.2 is
    # the earliest release whose starlette range (<0.49) admits 0.48, and it is
    # verified to mount the MCP ASGI app and complete a tool round-trip.
    "fastapi>=0.116.2",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "neo4j>=5.26.0",
    "rapidfuzz>=3.10.0",
    "langgraph>=0.2.45",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    # AI-facing interface layer. The MCP server is an adapter over the same
    # services the REST API uses; it holds no business or safety logic.
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
